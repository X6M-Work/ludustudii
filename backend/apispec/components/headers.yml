RequestId:
  description: Incoming X-Request-Id value, or a generated request ID when none was supplied.
  required: true
  schema:
    type: string
ETag:
  description: Strong entity tag containing the card's decimal version.
  required: true
  schema:
    type: string
    pattern: '^"[1-9][0-9]*"$'
    example: '"1"'
