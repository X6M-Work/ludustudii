description: |
  GET and HEAD are supported. Other methods return 405 with the shared JSON
  error body (code method_not_allowed), Allow: GET, HEAD, Cache-Control:
  no-store and X-Request-Id. The global 1 MiB body limit runs before probe
  handling and rejects oversized declared bodies with 413.
parameters:
  - $ref: '../components/parameters.yml#/RequestId'
get:
  tags: [Operations]
  operationId: getLiveness
  summary: Liveness probe
  description: Checks no dependencies, including the database. Succeeds whenever the process can answer HTTP, including during draining.
  responses:
    '200':
      $ref: '../components/responses/probes.yml#/ProbeOK'
    '413':
      $ref: '../components/responses/errors.yml#/PayloadTooLarge'
head:
  tags: [Operations]
  operationId: headLiveness
  summary: Liveness probe
  description: Checks no dependencies, including the database. Succeeds whenever the process can answer HTTP, including during draining. HEAD sends no body.
  responses:
    '200':
      $ref: '../components/responses/probes.yml#/HeadProbeOK'
    '413':
      $ref: '../components/responses/head.yml#/HeadPayloadTooLarge'
