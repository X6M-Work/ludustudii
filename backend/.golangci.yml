# golangci-lint v2.15.0; settings checked against its .golangci.reference.yml.
version: "2"
run:
  build-tags: [unit, integration, apidocs]
linters:
  default: standard
  enable:
    - errorlint
    - rowserrcheck
    - sqlclosecheck
    - bodyclose
    - noctx
    - usetesting
    - contextcheck
    - exhaustive
    - nilerr
    - nilnil
    - gosec
    - revive
    - godot
    - sloglint
    - depguard
    - forbidigo
    - thelper
    - tparallel
    - nolintlint
    - usestdlibvars
    - copyloopvar
    - intrange
    - unconvert
    - misspell
    - errname
    - perfsprint
    - modernize
    - unparam
    - gocritic
  settings:
    usetesting:
      context-background: true
      context-todo: true
    revive:
      rules:
        - name: exported
        - name: package-comments
    sloglint:
      no-mixed-args: true
      key-naming-case: snake
      context: scope
    depguard:
      rules:
        kit:
          files: ["**/internal/kit/*.go", "**/internal/kit/**/*.go", "!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/infra
              desc: kit must remain independent of infrastructure
            - pkg: github.com/apotourlyan/ludustudii/internal/services
              desc: kit must remain independent of services
            - pkg: github.com/apotourlyan/ludustudii/internal/app
              desc: kit must remain independent of application wiring
        services:
          files: ["**/internal/services/*.go", "**/internal/services/**/*.go", "!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/app
              desc: services must remain independent of application wiring
            - pkg: github.com/apotourlyan/ludustudii/internal/infra
              desc: services must remain independent of infrastructure
        testkit:
          files: ["!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/testkit
              desc: testkit is only for test files
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: use the structured logger
        - pattern: '^log\..*$'
          pkg: '^log$'
          msg: use log/slog
        - pattern: '^os\.(Getenv|LookupEnv)$'
          msg: read environment through internal/infra/env
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    paths:
      - internal/infra/apidocs/dist
      - internal/infra/spa/dist
    rules:
      # Security fixtures intentionally include unsafe inputs.
      - path: '_test\.go$'
        linters: [gosec]
      # Environment access belongs to the configuration boundary and test harness.
      - path: 'internal/(infra/env|testkit)/'
        linters: [forbidigo]
        text: '^use of `os\.(Getenv|LookupEnv)`'
      # Do consumes and closes the response before returning metadata and bytes.
      - path: '_test\.go$'
        source: '\btestkit\.Do\('
        linters: [bodyclose]
      - path: 'internal/testkit/openapi_test\.go$'
        source: ':= Do\('
        linters: [bodyclose]
      # Walk every error-tree branch; errors.As would skip or duplicate siblings.
      - path: 'internal/kit/erresp/error\.go$'
        text: '(type assertion on error|type switch on error)'
        linters: [errorlint]
      # This constructor test checks exact error identity, not unwrap matching.
      - path: 'internal/kit/validator/errors_test\.go$'
        source: 'got\.Err != err'
        linters: [errorlint]
      # The reflective walker only descends into containers; scalar kinds are leaves.
      - path: 'apispec/bundle_test\.go$'
        source: 'switch v\.Kind\(\)'
        linters: [exhaustive]
      # The local CLI intentionally accepts its output path and writes a public spec.
      - path: 'cmd/tools/bundlespec/main\.go$'
        text: 'G(306|703):'
        linters: [gosec]
      # This is an environment variable name, not a hardcoded credential.
      - path: 'internal/infra/env/load\.go$'
        source: 'EnvAppWriteTimeout\s*= "APP_WRITE_TIMEOUT"'
        text: 'G101:'
        linters: [gosec]
formatters:
  enable: [gofumpt, goimports]
  exclusions:
    generated: lax
    paths:
      - internal/infra/apidocs/dist
      - internal/infra/spa/dist
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
